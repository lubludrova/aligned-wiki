<title id="title">STEM: from video to verifiable work history</title><desc id="desc">Two-panel proposed architecture. Source video becomes thirty-second evidence leaves with construction keys and provenance. Global and scoped retrieval complete evidence slots, inspect original video and produce grounded answers. Reports enumerate the full scope. Optional episodes do not replace leaves.</desc>
